[package]
name = "office363"
# Generated from package.json with npm run version:set -- MAJOR.MINOR.PATCH.
version = "0.1.0"
description = "Microsoft 365 Installer for Linux (Wine + Office Deployment Tool)"
authors = ["Office363"]
edition = "2021"

[lib]
name = "office363_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
dirs = "5"
sha2 = "0.10"
